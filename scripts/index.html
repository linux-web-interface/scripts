<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux File Explorer - Setup Check</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.6; }
    code { padding: .15rem .35rem; border-radius: .25rem; background: color-mix(in srgb, CanvasText 10%, Canvas); }
    #status { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Linux File Explorer</h1>
  <p>Apache berhasil menyajikan halaman web. Ini hanya halaman pemeriksaan awal, belum merupakan file browser.</p>
  <h2>Status API Python</h2>
  <p id="status">Memeriksa <code>/api/health</code> ...</p>
  <p>Backend yang direncanakan berjalan di <code>127.0.0.1:5000</code> dan diakses melalui Apache.</p>
  <script>
    fetch('/api/health', { headers: { 'Accept': 'application/json' } })
      .then(async (response) => {
        const body = await response.text();
        document.querySelector('#status').textContent =
          response.ok ? `API merespons (${response.status}): ${body}`
                      : `Apache terhubung, tetapi API merespons HTTP ${response.status}.`;
      })
      .catch(() => {
        document.querySelector('#status').textContent =
          'API belum berjalan atau belum menyediakan endpoint /api/health.';
      });
  </script>
</body>
</html>
